name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features
      # --all-targets so test code is linted too. Without it, warnings inside
      # #[cfg(test)] modules and tests/ are invisible to CI.
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo fmt --check

  # Every optional feature is built and tested, individually and together. Nothing
  # previously compiled them at all, so the TUI, the Postgres session store and the SSE
  # server could break without CI noticing — and release binaries ship without them.
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["postgres", "sse", "dev-tools", "tui"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ matrix.features }}
      - run: cargo build --features ${{ matrix.features }}
      - run: cargo test --features ${{ matrix.features }} -- --test-threads=1

  all-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features -- --test-threads=1

  # Release ships macOS and Windows binaries, so both must at least compile here.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -- --test-threads=1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  # The Harbor adapter produces the project's headline benchmark numbers and had no
  # automation at all: 22 pytest tests that never ran anywhere.
  harbor-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        working-directory: harbor-adapter
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # `harbor` may not be installable from a public index; the adapter's own tests
          # do not require it, so a failure here must not fail the job.
          pip install -e . || echo "adapter deps unavailable; running tests standalone"
      - name: Run adapter tests
        working-directory: harbor-adapter
        run: python -m pytest tests/ -v

  script-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run shell script tests
        run: bash scripts/test-install.sh
