[package]
name = "remix-agent-runtime"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "LLM-driven browser automation agent runtime powered by remix-browser"
repository = "https://github.com/hkd987/remix-agent-runtime"

[[bin]]
name = "remix-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
remix-credentials = { git = "https://github.com/hkd987/remix-credentials" }
rmcp = { version = "0.14", features = ["client", "transport-child-process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

[dev-dependencies]
mockito = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio-test = "0.4"
