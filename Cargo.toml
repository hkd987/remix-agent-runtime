[package]
name = "remix-agent-runtime"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "LLM-driven browser automation agent runtime powered by remix-browser"
repository = "https://github.com/hkd987/remix-agent-runtime"

[[bin]]
name = "remix-agent"
path = "src/main.rs"

[features]
default = []
postgres = ["sqlx"]

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
futures-core = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
remix-credentials = { git = "https://github.com/hkd987/remix-credentials" }
rmcp = { version = "0.14", features = ["client", "transport-child-process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
regex = "1"
glob = "0.3"
tokio-util = "0.7"
htmd = "0.5"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "uuid"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
mockito = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio-test = "0.4"
